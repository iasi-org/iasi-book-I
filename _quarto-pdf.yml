project:
  output-dir: outputs/docs/pdf

#book:
#  output-file: "IASI Vol-I"
  
format:
  pdf:
    documentclass: scrreprt
    classoption:
      - twoside
      - open=right    
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
    linkcolor: black
    urlcolor: blue
    citecolor: blue      

    geometry:
      - top=22mm
      - bottom=22mm
      - left=25mm
      - right=25mm
      - headheight=15pt
      - headsep=8mm
      - footskip=10mm
      
    template-partials:
      - resources/pdf/before-body.tex

    include-in-header:
      - text: |
           \usepackage{eso-pic}
      - resources/pdf/header-footer.tex
