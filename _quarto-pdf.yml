project:
  output-dir: outputs/pdf

#book:
#  output-file: "IASI Vol-I"
format:
  pdf:
    documentclass: scrreprt
    classoption:
      - twoside
      - open=right    
    papersize: a4
    toc: true
    toc-depth: 1      
    number-sections: true
    colorlinks: true
    linkcolor: black
    urlcolor: blue
    citecolor: blue      

    geometry:
      - top=22mm
      - bottom=22mm
      - left=25mm
      - right=25mm
      - headheight=15pt
      - headsep=8mm
      - footskip=10mm
      
    template-partials:
      - resources/latex/before-body.tex

    include-in-header:
      - text: |
           \usepackage{eso-pic}
      - resources/latex/header-footer.tex
      - resources/latex/part-numbering.tex
      - text: |
           % Nombre de la parte actual en el pie interior de páginas pares e impares.
           \renewcommand{\partmark}[1]{\markboth{#1}{}}
           \fancyfoot[LO,RE]{\footnotesize\nouppercase{\leftmark}}

           % Compactar títulos de capítulo y sección para una composición más editorial.
           \RedeclareSectionCommand[
             afterskip=.2\baselineskip
           ]{chapter}
           \RedeclareSectionCommand[
             beforeskip=.35\baselineskip,
             afterskip=.2\baselineskip
           ]{section}
